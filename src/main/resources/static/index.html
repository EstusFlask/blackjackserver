<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Blackjack</title>
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.7.6/dist/vuetify.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            background: #f4f2ec;
        }

        [v-cloak] {
            display: none;
        }

        .table-shell {
            min-height: 100vh;
            background:
                    linear-gradient(140deg, rgba(17, 95, 74, 0.95), rgba(25, 122, 86, 0.92)),
                    #14664d;
        }

        .game-wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 32px 16px;
        }

        .game-title {
            color: #fffaf0;
            font-size: 32px;
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: 0;
        }

        .game-subtitle {
            color: rgba(255, 250, 240, 0.78);
            margin-top: 6px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 28px 0 22px;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .status-panel {
            margin-top: 16px;
        }

        .game-panel {
            border: 1px solid rgba(31, 41, 55, 0.08);
            border-radius: 8px;
            min-height: 190px;
        }

        .panel-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 18px;
            font-weight: 700;
            color: #263238;
            letter-spacing: 0;
        }

        .score {
            color: #8b4513;
            font-weight: 700;
            white-space: nowrap;
        }

        .card-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
            min-height: 42px;
        }

        .playing-card {
            border: 1px solid #d6c4a5;
            background: #fffdf8;
            color: #1f2933;
            border-radius: 6px;
            padding: 10px 12px;
            font-weight: 700;
            box-shadow: 0 2px 0 rgba(87, 65, 35, 0.18);
        }

        .empty-text {
            color: #6b7280;
            margin-top: 18px;
        }

        .status-text {
            color: #263238;
            font-size: 20px;
            font-weight: 700;
            line-height: 1.35;
            letter-spacing: 0;
        }

        .status-detail {
            color: #5f6368;
            margin-top: 8px;
        }

        @media (max-width: 720px) {
            .game-wrap {
                padding: 24px 12px;
            }

            .panel-grid {
                grid-template-columns: 1fr;
            }

            .game-title {
                font-size: 28px;
            }

            .actions .v-btn {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>
<div id="app" v-cloak>
    <v-app>
        <v-main class="table-shell">
            <div class="game-wrap">
                <header>
                    <div class="game-title">Blackjack</div>
                    <div class="game-subtitle">当前一局结束后，需要重新开始游戏。</div>
                </header>

                <div class="actions">
                    <v-btn
                            color="amber-darken-2"
                            size="large"
                            variant="flat"
                            :loading="loadingAction === 'start'"
                            :disabled="loading"
                            @click="startGame"
                    >
                        <v-icon :icon="started ? 'mdi-refresh' : 'mdi-play'" start></v-icon>
                        {{ started ? '重新开始游戏' : '开始游戏' }}
                    </v-btn>
                    <v-btn
                            color="teal-lighten-5"
                            size="large"
                            variant="flat"
                            :loading="loadingAction === 'hit'"
                            :disabled="!canPlay"
                            @click="hit"
                    >
                        <v-icon icon="mdi-plus" start></v-icon>
                        Hit
                    </v-btn>
                    <v-btn
                            color="red-lighten-5"
                            size="large"
                            variant="flat"
                            :loading="loadingAction === 'stand'"
                            :disabled="!canPlay"
                            @click="stand"
                    >
                        <v-icon icon="mdi-hand-back-right" start></v-icon>
                        Stand
                    </v-btn>
                </div>

                <section class="panel-grid">
                    <v-card class="game-panel" elevation="3">
                        <v-card-text>
                            <div class="panel-title">
                                <span>玩家手牌</span>
                                <span v-if="playerScoreText" class="score">{{ playerScoreText }}</span>
                            </div>
                            <div v-if="playerCards.length" class="card-list">
                                <span v-for="card in playerCards" :key="card" class="playing-card">{{ card }}</span>
                            </div>
                            <div v-else class="empty-text">点击开始游戏。</div>
                        </v-card-text>
                    </v-card>

                    <v-card class="game-panel" elevation="3">
                        <v-card-text>
                            <div class="panel-title">
                                <span>庄家手牌</span>
                                <span v-if="dealerScoreText" class="score">{{ dealerScoreText }}</span>
                            </div>
                            <div v-if="showDealerHand" class="card-list">
                                <span v-for="card in dealerCards" :key="card" class="playing-card">{{ card }}</span>
                            </div>
                            <div v-else class="empty-text">游戏结束时显示。</div>
                        </v-card-text>
                    </v-card>
                </section>

                <v-card class="game-panel status-panel" elevation="3">
                    <v-card-text>
                        <div class="panel-title">
                            <span>游戏状态</span>
                        </div>
                        <div class="status-text">{{ statusTitle }}</div>
                        <div class="status-detail">{{ statusDetail }}</div>
                    </v-card-text>
                </v-card>
            </div>
        </v-main>
    </v-app>
</div>

<script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vuetify@3.7.6/dist/vuetify.min.js"></script>
<script>
    const {createApp} = Vue;
    const {createVuetify} = Vuetify;

    createApp({
        data() {
            return {
                started: false,
                gameOver: true,
                loadingAction: null,
                statusTitle: '准备开始',
                statusDetail: '点击开始游戏发牌。',
                playerHand: null,
                playerScore: null,
                dealerHand: null,
                dealerScore: null
            };
        },
        computed: {
            loading() {
                return this.loadingAction !== null;
            },
            canPlay() {
                return this.started && !this.gameOver && !this.loading;
            },
            playerCards() {
                return this.parseHand(this.playerHand);
            },
            dealerCards() {
                return this.parseHand(this.dealerHand);
            },
            showDealerHand() {
                return this.gameOver && this.dealerCards.length > 0;
            },
            playerScoreText() {
                return this.playerScore === null ? '' : `点数 ${this.playerScore}`;
            },
            dealerScoreText() {
                return this.showDealerHand && this.dealerScore !== null ? `点数 ${this.dealerScore}` : '';
            }
        },
        methods: {
            async startGame() {
                await this.callApi('start');
            },
            async hit() {
                await this.callApi('hit');
            },
            async stand() {
                await this.callApi('stand');
            },
            async callApi(action) {
                this.loadingAction = action;
                try {
                    const response = await fetch(`/game/${action}`, {method: 'POST'});
                    const state = await response.json();
                    this.applyGameState(state, response.ok);
                } catch (error) {
                    this.statusTitle = '请求失败';
                    this.statusDetail = '请确认后端服务已经启动。';
                } finally {
                    this.loadingAction = null;
                }
            },
            applyGameState(state, ok) {
                this.started = ok || this.started;
                this.gameOver = Boolean(state.gameOver);
                this.playerHand = state.playerHand;
                this.playerScore = state.playerScore ?? null;
                this.dealerHand = state.dealerHand;
                this.dealerScore = state.dealerScore ?? null;
                this.statusTitle = this.statusFromResult(state);
                this.statusDetail = state.message || '';
            },
            statusFromResult(state) {
                if (state.result === 'won') {
                    return 'Player won';
                }
                if (state.result === 'lost') {
                    return 'Player lost';
                }
                if (state.result === 'draw') {
                    return 'Draw';
                }
                return state.gameOver ? '等待开始' : '游戏进行中';
            },
            parseHand(hand) {
                if (!hand) {
                    return [];
                }

                return hand
                        .replace(/^\[/, '')
                        .replace(/]$/, '')
                        .split(',')
                        .map(card => card.trim())
                        .filter(Boolean);
            }
        }
    }).use(createVuetify()).mount('#app');
</script>
</body>
</html>
